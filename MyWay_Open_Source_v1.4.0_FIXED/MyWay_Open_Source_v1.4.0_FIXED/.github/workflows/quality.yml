name: Quality
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run sync
      - run: npm run check
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Testar host Windows
        working-directory: desktop
        run: go test ./...
