name: Build Android
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm run sync
      - name: Gerar APK debug
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MyWay-Android-debug
          path: android/build/outputs/apk/debug/*.apk

  android-release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm run sync
      - name: Restaurar keystore
        shell: bash
        env:
          MYWAY_KEYSTORE_B64: ${{ secrets.MYWAY_KEYSTORE_B64 }}
        run: |
          test -n "$MYWAY_KEYSTORE_B64" || (echo "Configure MYWAY_KEYSTORE_B64 nos secrets" && exit 1)
          echo "$MYWAY_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/myway-release.jks"
      - name: Gerar APK release assinado
        working-directory: android
        env:
          MYWAY_KEYSTORE_PATH: ${{ runner.temp }}/myway-release.jks
          MYWAY_KEYSTORE_PASSWORD: ${{ secrets.MYWAY_KEYSTORE_PASSWORD }}
          MYWAY_KEY_ALIAS: ${{ secrets.MYWAY_KEY_ALIAS }}
          MYWAY_KEY_PASSWORD: ${{ secrets.MYWAY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: MyWay-Android-release
          path: android/build/outputs/apk/release/*.apk
