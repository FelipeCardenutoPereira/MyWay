name: Build Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: MyWay-Windows
          path: |
            releases/*.exe
